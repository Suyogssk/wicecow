apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels:
    app.kubernetes.io/name: wisecow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wisecow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wisecow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: wisecow
          image: ghcr.io/suyogssk/wicecow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4499
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: wisecow
  labels:
    app.kubernetes.io/name: wisecow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wisecow
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
