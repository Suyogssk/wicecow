name: Build and deploy Wisecow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wisecow-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    if: ${{ vars.DEPLOY_TO_K8S == 'true' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out manifests
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Apply manifests and roll out image
        shell: pwsh
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
        run: |
          $namespace = if ($env:KUBE_NAMESPACE) { $env:KUBE_NAMESPACE } else { 'wisecow' }
          kubectl config use-context minikube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl get namespace $namespace *> $null
          if ($LASTEXITCODE -ne 0) { kubectl create namespace $namespace }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -n $namespace -f k8s/deployment.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -n $namespace -f k8s/ingress.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl set image -n $namespace deployment/wisecow "wisecow=$env:IMAGE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status -n $namespace deployment/wisecow --timeout=180s
