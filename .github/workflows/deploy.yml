name: Build and deploy Wisecow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wisecow-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out manifests
        uses: actions/checkout@v4

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: wisecow

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load published image into Kind
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          LATEST_IMAGE: ${{ needs.build.outputs.image }}:latest
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$LATEST_IMAGE"
          kind load docker-image "$IMAGE" "$LATEST_IMAGE" --name wisecow

      - name: Install Traefik ingress controller
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik \
            --namespace traefik --create-namespace \
            --set ingressClass.enabled=true \
            --set ingressClass.name=traefik \
            --set ingressClass.isDefaultClass=false \
            --set providers.kubernetesIngress.enabled=true \
            --wait --timeout 180s

      - name: Create local TLS secret
        run: |
          kubectl create namespace wisecow --dry-run=client -o yaml | kubectl apply -f -
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/wisecow.test.key \
            -out /tmp/wisecow.test.crt -days 1 -subj "/CN=wisecow.test" \
            -addext "subjectAltName=DNS:wisecow.test"
          kubectl create secret tls wisecow-tls -n wisecow \
            --cert=/tmp/wisecow.test.crt --key=/tmp/wisecow.test.key \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Wisecow
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          kubectl apply -n wisecow -f k8s/deployment.yaml
          kubectl set image -n wisecow deployment/wisecow "wisecow=$IMAGE"
          kubectl apply -n wisecow -f k8s/ingress.yaml
          kubectl rollout status -n wisecow deployment/wisecow --timeout=180s

      - name: Verify HTTPS ingress response
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward -n traefik svc/traefik 10443:443 >/tmp/wisecow-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          status_code=000
          for attempt in $(seq 1 30); do
            status_code=$(curl --silent --insecure --output /tmp/wisecow-response.html \
              --write-out '%{http_code}' --resolve wisecow.test:10443:127.0.0.1 \
              https://wisecow.test:10443/ || true)
            if [ "$status_code" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status_code" != "200" ]; then
            cat /tmp/wisecow-port-forward.log
            echo "HTTPS request returned HTTP $status_code"
            exit 1
          fi
          grep -q '<pre>' /tmp/wisecow-response.html
